name: remove annotation font limit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove 72pt annotation limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/desktop/ui/textsettings.ui')
          s = p.read_text()
          old = '<double>72.000000000000000</double>'
          new = '<double>10000.000000000000000</double>'
          if old not in s:
              raise SystemExit('72pt limit not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/remove-annotation-font-limit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop/ui/textsettings.ui .github/workflows/remove-annotation-font-limit.yml
          git commit -m 'remove annotation font size limit'
          git push
